<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Art 101 synthetic browser regression</title></head><body>
<h1>ART101 synthetic browser test — no real learner data</h1><pre id="result">RUNNING</pre><iframe title="Art 101 lesson synthetic browser" id="lesson" style="width:100%;height:650px"></iframe>
<script>
(async()=>{
'use strict';
const out=document.getElementById('result'),frame=document.getElementById('lesson'),sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const doc=()=>frame.contentWindow.document;
async function until(fn,why){for(let n=0;n<100;n++){try{if(fn())return;}catch{}await sleep(100);}throw Error('Timed out: '+why);}
function open(url){return new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.src=url;});}
function reload(){return new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.contentWindow.location.reload();});}
function setValue(id,val){const node=doc().getElementById(id);node.value=val;node.dispatchEvent(new Event('input',{bubbles:true}));}
function sendFile(file){const input=doc().getElementById('importFile'),dt=new DataTransfer();dt.items.add(file);input.files=dt.files;input.dispatchEvent(new Event('change',{bubbles:true}));}
try{
 await open('../academy/grade-9/unit-10/week-27/index.html');
 await until(()=>frame.contentWindow.BazaarArt101Draft&&doc().querySelectorAll('[data-bazaar-quiz] fieldset').length===5,'Week 27 startup and quiz');
 let win=frame.contentWindow;
 if(win.BazaarArt101Draft.week!==27||win.BazaarArt101Draft.unit!==10)throw Error('Wrong Week 27 lesson data');
 if(!doc().querySelector('figure svg[role=img]'))throw Error('Accessible lesson diagram missing');
 if(doc().querySelectorAll('main .stage-grid details').length!==5)throw Error('Five lesson stages missing');
 const key='bazaar_art101_u10_w27_evidence_v1';
 setValue('title','Synthetic sequence draft');
 setValue('question','What changes when we alter sequence and documentary captions?');
 setValue('reflection','This is a synthetic evidence record created by an automated browser test.');
 await until(()=>JSON.parse(localStorage.getItem(key)||'null')?.record?.title==='Synthetic sequence draft','Week27 autosave');
 await reload();
 await until(()=>frame.contentWindow.BazaarArt101Draft&&doc().getElementById('title').value==='Synthetic sequence draft','Week27 reload');
 win=frame.contentWindow;
 const data=win.BazaarArt101Draft.exportRecord();
 if(data.schema!=='bazaar-art-evidence'||data.unit!==10||data.week!==27)throw Error('Week 27 JSON export contract mismatch');
 if(data.record.question!=='What changes when we alter sequence and documentary captions?')throw Error('Draft did not survive reload');
 win.confirm=()=>true;
 sendFile(new File([JSON.stringify({...data,week:28,record:{...data.record,title:'Wrong week'}})],'wrong-week.json',{type:'application/json'}));
 await until(()=>doc().getElementById('status').textContent.includes('Import rejected'),'cross-week import rejection');
 if(doc().getElementById('title').value!=='Synthetic sequence draft')throw Error('Cross-week import overwrote existing work');
 sendFile(new File([JSON.stringify({...data,record:{...data.record,title:'Validated local restore'}})],'matching.json',{type:'application/json'}));
 await until(()=>doc().getElementById('title').value==='Validated local restore','exact-week import');
 const quiz=doc().querySelector('[data-bazaar-quiz]'),bank=JSON.parse(doc().getElementById('art101-quiz-bank').textContent);
 if(bank.length!==15)throw Error('Expected 15 practice questions');
 const fields=Array.from(quiz.querySelectorAll('fieldset'));
 if(fields.length!==5)throw Error('Expected five sampled questions');
 for(const field of fields){
   const prompt=field.querySelector('legend').textContent.replace(/^\d+\.\s*/,''),item=bank.find(q=>q.prompt===prompt);
   if(!item)throw Error('Question absent from bank');
   const answer=item.choices[item.answer];
   const label=Array.from(field.querySelectorAll('label')).find(x=>x.textContent.trim()===answer);
   if(!label)throw Error('Answer not rendered '+prompt);
   label.querySelector('input').click();
 }
 doc().getElementById('bazaar-submit').click();
 await until(()=>doc().getElementById('bazaar-submit').disabled,'quiz lock');
 if(!doc().getElementById('bazaar-quiz-result').textContent.includes('100%'))throw Error('Correct answers not scored correctly');
 if(Array.from(quiz.querySelectorAll('input[type=radio]')).some(x=>!x.disabled))throw Error('Submitted radio inputs remain editable');
 if(doc().getElementById('bazaar-retake').hidden)throw Error('Retake not available after submission');
 const attempts=JSON.parse(localStorage.getItem('bazaar_art_formative_v1_ART101-U10-W27')||'[]');
 if(attempts.length<1||attempts.at(-1).score!==100||attempts.at(-1).passed!==true)throw Error('Formative attempt not retained');
 doc().getElementById('bazaar-retake').click();
 await until(()=>!doc().getElementById('bazaar-submit').disabled,'new five-question attempt');
 if(doc().querySelectorAll('[data-bazaar-quiz] fieldset').length!==5)throw Error('Retake question set missing');
 await open('../academy/grade-9/unit-13/week-36/index.html');
 await until(()=>frame.contentWindow.BazaarArt101Draft?.week===36,'Week 36 startup');
 if(doc().getElementById('title').value==='Validated local restore')throw Error('Week27 data leaked into Week36');
 if(!doc().body.textContent.includes('Portfolio Exhibition and Artist Defense'))throw Error('Week36 portfolio content missing');
 if(JSON.parse(doc().getElementById('art101-quiz-bank').textContent).length!==15)throw Error('Week36 bank incomplete');
 if(JSON.parse(localStorage.getItem(key))?.record?.title!=='Validated local restore')throw Error('Week27 record lost');
 out.textContent='ART101_BROWSER_PASS: lesson load, five stages, quiz 15→5, answer locking, autosave/reload, exact-week import and isolation';
}catch(error){out.textContent='ART101_BROWSER_FAIL: '+(error&&error.stack||String(error));}
})();
</script></body></html>
